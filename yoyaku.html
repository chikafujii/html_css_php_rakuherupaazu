		</a>

<body>
	<main>

		<section class="pagetitle"> 
			<h1>予約申し込み
			</h1>
		</section>

		<div class="form">
			<p>お問い合わせは、以下のフォームよりお気軽にお送りください。<br>必要事項をご記入のうえ、送信をお願いいたします。</p>
		</div>

		<!-- Reservation fields -->
			<form action="reserve.php" method="post" class="reservation-form">

				<div class="form-row">
					<label for="name">お名前 <span class="required">※</span></label>
					<input type="text" id="name" name="name" required>
				</div>

				<div class="form-row">
					<label for="email">メールアドレス <span class="required">※</span></label>
					<input type="email" id="email" name="email" required>
				</div>

				<div class="form-row">
					<label for="phone">電話番号</label>
					<input type="tel" id="phone" name="phone">
				</div>

				<div class="form-row">
					<label for="service">ご希望サービス <span class="required">※</span></label>
					<select id="service" name="service" required>
						<option value="">選択してください</option>
						<option value="cleaning">清掃・洗濯</option>
						<option value="cooking">料理</option>
						<option value="care">介護サポート</option>
						<option value="pet">植物・ペットのお世話</option>
					</select>
				</div>

				<div class="form-row">
					<label for="reservation_date">ご希望日 <span class="required">※</span></label>
					<input type="date" id="reservation_date" name="reservation_date" required>
				</div>

				<div class="form-row">
					<label for="reservation_time">ご希望時間 <span class="required">※</span></label>
					<select id="reservation_time" name="reservation_time" required>
						<option value="">選択してください</option>
						<option value="09:00">9:00</option>
						<option value="11:00">11:00</option>
						<option value="13:00">13:00</option>
						<option value="15:00">15:00</option>
					</select>
				</div>

				<div class="form-row">
					<label for="message">ご要望</label>
					<textarea id="message" name="message" rows="6"></textarea>
				</div>

				<button type="submit" class="submit-button">
					入力内容を送信
				</button>

			</form>

	</main>

</body>

</html>
